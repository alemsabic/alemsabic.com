<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alem Sabic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #d4d4d4;
            background: #141516;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            z-index: 9999;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .image-side {
            flex: 1;
            background: url('alem-sabic-dark.png') center center / cover no-repeat;
            position: relative;
            opacity: 0;
            animation: fadeIn 1.2s ease-out 0.8s forwards;
        }

        .image-side::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 300px;
            background: linear-gradient(to left,
                #141516 0%,
                rgba(20, 21, 22, 0.95) 20%,
                rgba(20, 21, 22, 0.7) 50%,
                rgba(20, 21, 22, 0.3) 75%,
                transparent 100%);
        }

        .content-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            opacity: 0;
            animation: fadeIn 1.2s ease-out 0.3s forwards;
        }

        .content {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw + 1rem, 5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 2rem;
            color: #a8a89e;
        }

        .intro {
            font-size: clamp(2rem, 2vw + 1.5rem, 2.25rem);
            line-height: 1.5;
            margin-bottom: 3rem;
        }

        .intro a {
            color: #a8a89e;
            text-decoration: none;
            border-bottom: 1px solid rgba(168, 168, 158, 0.3);
            transition: border-color 0.25s ease;
        }

        .intro a:hover {
            border-bottom-color: #a8a89e;
        }

        .section {
            margin-bottom: 4rem;
        }

        .section-label {
            font-size: clamp(2rem, 3vw + 1rem, 3rem);
            font-weight: 900;
            color: #f6f6f6;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .links a {
            color: #8c8c87;
            text-decoration: none;
            font-size: clamp(1.125rem, 1.5vw + 0.5rem, 1.375rem);
            transition: color 0.25s ease;
        }

        .links a:hover {
            color: #a8a89e;
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .image-side {
                min-height: 40vh;
            }

            .image-side::before {
                width: 100%;
                height: 300px;
                right: auto;
                left: 0;
                top: auto;
                bottom: 0;
                background: linear-gradient(to top,
                    #141516 0%,
                    rgba(20, 21, 22, 0.95) 20%,
                    rgba(20, 21, 22, 0.7) 50%,
                    rgba(20, 21, 22, 0.3) 75%,
                    transparent 100%);
            }

            .content-side {
                padding: 3rem 1.5rem;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="image-side"></div>
        <div class="content-side">
            <div class="content">
                <h1>Alem Šabić</h1>

                <p class="intro">Lorem ipsum dolor sit amet, <a href="https://www.linkedin.com/in/alem%C5%A1abi%C4%87/" target="_blank">LinkedIn</a> sadipscing elitr, sed diam nonumy eirmod <a href="https://www.x.com/sarajevo" target="_blank">x.com</a> invidunt ut labore et dolore magna aliquyam erat, sed diam <a href="https://gpunkt.org" target="_blank">gpunkt.org</a>.</p>

                <!-- Kontakt section - removed for now, may be added back later
                <div class="section">
                    <div class="section-label">Kontakt</div>
                    <div class="links">
                        <a href="#">E-Mail</a>
                        <a href="https://www.linkedin.com/in/alem%C5%A1abi%C4%87/" target="_blank">LinkedIn</a>
                    </div>
                </div>
                -->
            </div>
        </div>
    </div>
</body>
</html>
